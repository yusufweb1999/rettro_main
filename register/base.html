{% load static %}
<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090f20">
  <title>{% block title %}NEXA CRM{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<header class="topbar container">
  <a class="brand" href="{% url 'home' %}"><span class="brand-icon">N</span><span>NEXA<span class="brand-muted">CRM</span></span></a>
  <nav class="nav">
    {% if user.is_authenticated %}
      <span class="nav-user">Salom, {{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" class="inline-form">{% csrf_token %}<button type="submit" class="btn btn-ghost">Chiqish</button></form>
    {% else %}
      <a class="nav-link" href="{% url 'login' %}">Kirish</a>
      <a class="btn btn-primary btn-small" href="{% url 'register' %}">Boshlash</a>
    {% endif %}
  </nav>
</header>
<main class="container page-enter">{% block content %}{% endblock %}</main>
<footer class="footer container">© {% now 'Y' %} NEXA CRM · Django bilan yaratilgan</footer>
</body>
</html>
